    var ITER = 600000;

    var SK = "ciq_pw_ishcmc";

    function b64decode(s) {
        var bin = atob(s), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
    }

    function tryDecrypt(password) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]).then(function(baseKey) {
            return crypto.subtle.deriveBits({
                name: "PBKDF2",
                salt: b64decode(SALT),
                iterations: ITER,
                hash: "SHA-256"
            }, baseKey, 256);
        }).then(function(keyBits) {
            return crypto.subtle.importKey("raw", keyBits, "AES-GCM", false, ["decrypt"]);
        }).then(function(aesKey) {
            return crypto.subtle.decrypt({
                name: "AES-GCM",
                iv: b64decode(IV)
            }, aesKey, b64decode(CT));
        }).then(function(decrypted) {
            var html = new TextDecoder().decode(decrypted);
            try { sessionStorage.setItem(SK, password); sessionStorage.setItem(SK + "_ts", String(Date.now())); } catch(e) {}
            document.open();
            document.write(html);
            document.close();
        });
    }

    var CACHE_TTL_MS = 8 * 60 * 60 * 1000;
    var saved = null;
    var tsKey = SK + "_ts";
    try {
        var ts = parseInt(sessionStorage.getItem(tsKey) || "0", 10);
        if (Date.now() - ts < CACHE_TTL_MS) {
            saved = sessionStorage.getItem(SK);
        } else {
            sessionStorage.removeItem(SK);
            sessionStorage.removeItem(tsKey);
        }
    } catch(e) {}
    if (saved) {
        tryDecrypt(saved).catch(function() {
            try { sessionStorage.removeItem(SK); sessionStorage.removeItem(tsKey); } catch(e) {}
        });
    }

    var attempts = 0;
    var locked = false;

    document.getElementById("form").addEventListener("submit", function(e) {
        e.preventDefault();
        if (locked) return;
        var pw = document.getElementById("pw");
        var btn = document.getElementById("btn");
        var msg = document.getElementById("msg");

        attempts++;
        if (attempts > 10) {
            locked = true;
            btn.disabled = true;
            msg.className = "msg error";
            msg.textContent = "Too many attempts. Refresh the page to try again.";
            return;
        }

        var delay = attempts > 5 ? 5000 : (attempts > 3 ? 1000 : 0);

        btn.disabled = true;
        msg.className = "msg info";
        msg.textContent = delay > 0 ? "Please wait..." : "Decrypting...";

        setTimeout(function() {
            msg.textContent = "Decrypting...";
            tryDecrypt(pw.value).catch(function() {
                btn.disabled = false;
                pw.classList.add("error");
                msg.className = "msg error";
                msg.textContent = "Incorrect password" + (attempts > 3 ? " (" + (10 - attempts) + " attempts remaining)" : "");
                setTimeout(function() { pw.classList.remove("error"); }, 400);
            });
        }, delay);
    });
})();
